name: Auto Commit Natural (Hourly)

on:
  schedule:
    - cron: "0 * * * *" # tiap 1 jam
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Random delay (max 10 minutes)
        run: |
          DELAY=$((RANDOM % 600))
          sleep $DELAY

      - name: Decide commit or skip
        run: |
          RAND=$((RANDOM % 100))
          echo "RAND=$RAND" >> $GITHUB_ENV

      - name: Update file
        if: env.RAND < 60
        run: |
          echo "- Update $(date '+%Y-%m-%d %H:%M:%S')" >> activity.md

      - name: Commit and push
        if: env.RAND < 60
        run: |
          git config user.name "Rafi Chandra"
          git config user.email "123737133+chandrarafi@users.noreply.github.com"
          git add activity.md
          git commit -m "chore: auto update $(date '+%H:%M')" || exit 0
          git push
